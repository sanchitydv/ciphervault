services:
  ciphervault:
    build: .
    ports:
      - "3000:3000"
    environment:
      TRUST_PROXY: "false"
    volumes:
      - ciphervault-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  ciphervault-data:
